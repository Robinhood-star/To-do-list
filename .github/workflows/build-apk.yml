name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Build the APK first so a failing unit test can never block it.
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalTodo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Tests run afterwards; they report problems but don't stop the APK upload.
      - name: Run unit tests
        continue-on-error: true
        run: gradle --no-daemon testDebugUnitTest
